apply plugin: 'com.android.application'

android {
    namespace 'org.redrossistudios.audioif'
    compileSdk 36
    defaultConfig {
        applicationId "org.redrossistudios.audioif"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Headless play harness (see PlayHarness.java): -Pplay=<commands file> [-PplayGame=...] [-PplaySeed=...]
    testOptions {
        unitTests.all {
            systemProperty 'play.commands', project.findProperty('play') ?: ''
            systemProperty 'play.game', project.findProperty('playGame') ?: ''
            systemProperty 'play.seed', project.findProperty('playSeed') ?: '1234'
            if (project.hasProperty('play')) {
                outputs.upToDateWhen { false }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':zmpp')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'junit:junit:4.13.2'
}
