apply plugin: 'com.android.application'

static String gitCommit() {
    try {
        def process = ['git', 'rev-parse', '--short', 'HEAD'].execute()
        def hash = process.text.trim()
        return process.waitFor() == 0 && hash ? hash : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

android {
    namespace 'org.redrossistudios.audioif'
    compileSdk 36
    defaultConfig {
        applicationId "org.redrossistudios.audioif"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        // Debug builds show the commit they were built from, e.g. "2.0-debug (956c743)".
        debug {
            versionNameSuffix "-debug (" + gitCommit() + ")"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Headless play harness (see PlayHarness.java): -Pplay=<commands file> [-PplayGame=...] [-PplaySeed=...]
    testOptions {
        unitTests.all {
            systemProperty 'play.commands', project.findProperty('play') ?: ''
            systemProperty 'play.game', project.findProperty('playGame') ?: ''
            systemProperty 'play.seed', project.findProperty('playSeed') ?: '1234'
            if (project.hasProperty('play')) {
                outputs.upToDateWhen { false }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':zmpp')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'junit:junit:4.13.2'
}
